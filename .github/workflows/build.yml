name: Build Android APK

on:
  push:
    branches: [ main, master, arena/01a00015-tapgame ]
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev build-essential ccache
          pip install --break-system-packages buildozer "cython==0.29.36"

      - name: Set JAVA_HOME
        run: echo "JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))" >> "$GITHUB_ENV"

      - name: Build with Buildozer
        run: |
          set -o pipefail
          buildozer android debug 2>&1 | tee /tmp/build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: arbitrage-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Debug log to issue (on failure)
        if: failure()
        run: |
          tail -c 4000 /tmp/build.log > /tmp/debug_body.txt 2>/dev/null || echo "no build.log" > /tmp/debug_body.txt
          gh issue create --title "APK build debug" --body-file /tmp/debug_body.txt || true
        env:
          GH_TOKEN: ${{ github.token }}
