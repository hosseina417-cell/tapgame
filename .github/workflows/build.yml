name: Build Android APK

on:
  push:
    branches: [ main, master, arena/01a00015-tapgame ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          android-api-level: "33"
          command: android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arbitrage-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Debug log on failure
        if: failure()
        run: |
          LOG=$(cat .buildozer/buildozer.log 2>/dev/null || echo "no buildozer.log")
          echo "$LOG" | head -c 3000 > /tmp/d.txt
          gh issue create --title "APK build failed" --body-file /tmp/d.txt || true
        env:
          GH_TOKEN: ${{ github.token }}
